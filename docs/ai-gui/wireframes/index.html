<body>
<header class="top"><div class="brand"><div class="windowdots" aria-hidden="true"><i></i><i></i><i></i></div><span class="brandmark" aria-hidden="true">AD</span><span>AgentDesktop</span></div><div class="topright"><span>设置与诊断</span><span>个人工作区 · 本机</span></div></header>
<section class="demo" aria-label="线框演示控制"><div><strong>工程线框 v1 · W01–W08</strong><small>所有连接、截图、测试与运行均为本地模拟；不会调用模型或控制桌面。</small></div><div class="demo-controls"><label for="demo-state" class="small">模拟状态</label><select id="demo-state"><option value="ready">正常 / 进行中</option><option value="empty">空状态</option><option value="loading">加载中</option><option value="error">错误</option><option value="conflict">保存冲突</option><option value="unknown">结果未知</option><option value="cancelling">正在停止</option><option value="finished">已完成</option><option value="disabled">已停用</option></select><button type="button" class="btn small" data-action="reset">重置</button></div></section>
<div class="layout"><aside><div class="navlabel">AI 配置与运行</div><nav class="nav" aria-label="工程线框页面" id="nav"></nav><div class="sidenote">离线文件 · 无外部资源<br>交互仅用于验证页面与状态。<br><br>版本：2026-10-08<br>协议：agentdesktop.ai/1<br>原生实现与真实输入测试待开发。</div></aside><main id="main" tabindex="-1"></main></div>
<div class="toast" role="status" aria-live="polite" id="toast" hidden></div>
<script>
'use strict';
const pages=[['W01','AI 连接','连接列表'],['W02','添加 / 编辑 AI 连接','连接编辑'],['W03','GUI 配置','GUI 配置'],['W04','连接与能力测试','能力测试'],['W05','启动 GUI 诊断运行','启动运行'],['W06','运行详情','运行详情'],['W07','需要处理的运行','异常与停止'],['W08','用量与诊断','用量诊断']];
const params=new URLSearchParams(location.hash.slice(1));
let page=pages.some(p=>p[0]===params.get('screen'))?params.get('screen'):'W01';
let state=['ready','empty','loading','error','conflict','unknown','cancelling','finished','disabled'].includes(params.get('state'))?params.get('state'):(page==='W07'?'unknown':'ready');
let lastCommand='尚未操作', toastTimer, modelRefreshed=false, stopAcknowledged=false, evidenceRead=false, rotateVisible=false, testCancelled=false, profileDraft=false; 
const q=s=>document.querySelector(s), qa=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,kind='',disabled=false,attrs='')=>`<button type="button" class="btn ${kind}" data-action="${action}" ${disabled?'disabled':''} ${attrs}>${label}</button>`;
const pill=(text,type='')=>`<span class="pill ${type}">${text}</span>`;
const banner=(title,text,type='')=>`<div class="banner ${type}" role="${type==='error'?'alert':'note'}"><span class="symbol" aria-hidden="true">${type?'!':'○'}</span><div><strong>${title}</strong>${text?`<br>${text}`:''}</div></div>`;
const panel=(title,body,extra='')=>`<section class="panel"><div class="panelhead"><h2>${title}</h2>${extra}</div><div class="panelbody">${body}</div></section>`;
const field=(id,label,value,help='',type='text',extra='')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${extra} aria-describedby="${id}-help ${id}-error"><small id="${id}-help">${help}</small><span class="error" id="${id}-error" role="alert"></span></div>`;
const select=(id,label,options,help='',attrs='')=>`<div class="field"><label for="${id}">${label}</label><select id="${id}" ${attrs}>${options}</select>${help?`<small>${help}</small>`:''}</div>`;
const opts=(values,selected)=>values.map(v=>`<option value="${esc(v[0])}" ${v[0]===selected?'selected':''} ${v[2]?'disabled':''}>${v[1]}</option>`).join('');
const facts=items=>`<dl class="facts">${items.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`;

function render(){q('#demo-state').value=state;q('#nav').innerHTML=pages.map(p=>`<button type="button" data-page="${p[0]}" ${page===p[0]?'aria-current="page"':''}><span class="wn">${p[0]}</span><span>${p[2]}</span></button>`).join('');q('#main').innerHTML=({W01:w01,W02:w02,W03:w03,W04:w04,W05:w05,W06:w06,W07:w07,W08:w08}[page])()+`<details class="specdrawer"><summary>工程契约 / 本页操作（模拟）</summary><div class="detailbody"><pre>页面 ${page}\n${commands[page].map(c=>'• '+c).join('\n')}\n\n最近模拟操作：${esc(lastCommand)}\n所有异步对象均通过 get 轮询；本地线框不发起网络请求。\n原生产品实现与真实模型 / 桌面输入测试状态：NOT_RUN</pre></div></details><div class="screenfoot"><span>${page} · ${esc(state)} · 页面交互与状态均为模拟</span><span>离线工程参考 / 固定示例数据 / 不保存凭据</span></div>`;if(q('#run-confirm'))q('#run-confirm').addEventListener('change',()=>{q('#run-start').disabled=!q('#run-confirm').checked||['disabled','unknown'].includes(state);});if(q('#run-start'))q('#run-start').disabled=true;if(q('#connection-search'))q('#connection-search').addEventListener('input',e=>{let n=0;qa('tr[data-connection]').forEach(row=>{const show=row.textContent.toLowerCase().includes(e.target.value.toLowerCase());row.hidden=!show;if(show)n++;});q('#connection-count').textContent=`${n} 个连接`;});history.replaceState(null,'',`#screen=${page}&state=${state}`);document.title=`${page} ${pages.find(p=>p[0]===page)[1]} · AgentDesktop 工程线框`;}
function goto(p,s='ready'){page=p;state=s;render();window.scrollTo(0,0);q('#main').focus({preventScroll:true});}
function showToast(message){q('#toast').textContent=message;q('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{q('#toast').hidden=true;},6500);}
function mark(command,message){lastCommand=command;showToast('模拟：'+message);const pre=q('.specdrawer pre');if(pre)pre.textContent=`页面 ${page}\n${commands[page].map(c=>'• '+c).join('\n')}\n\n最近模拟操作：${lastCommand}\n未发送网络请求。原生产品测试：NOT_RUN`;}
function error(id,message){const input=q('#'+id);if(input){input.setAttribute('aria-invalid','true');const target=q('#'+id+'-error');if(target)target.textContent=message;input.focus();}return false;}
function clearErrors(){qa('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'));qa('.field .error').forEach(e=>e.textContent='');}
function validateConnection(){clearErrors();if(!q('#connection-name').value.trim())return error('connection-name','请输入连接名称。');let u;try{u=new URL(q('#connection-url').value);}catch{return error('connection-url','请输入完整 URL。');}const loopback=['localhost','127.0.0.1','[::1]'].includes(u.hostname);if(!(u.protocol==='https:'||(u.protocol==='http:'&&loopback)))return error('connection-url','只允许 HTTPS 或本地 loopback HTTP。');if(u.username||u.password||u.search||u.hash)return error('connection-url','URL 不得包含用户信息、query 或 fragment；密钥单独填写。');const n=Number(q('#connection-timeout').value);if(!Number.isInteger(n)||n<100||n>120000)return error('connection-timeout','请输入 100–120000 毫秒。');if(q('#create-credential')&&!q('#create-credential').value.trim())return error('create-credential','v1 连接需要 API 密钥；本地夹具使用合成测试密钥。');return true;}
function validateProfile(){clearErrors();if(!q('#profile-name'))return false;if(!q('#profile-name').value.trim())return error('profile-name','请输入配置名称。');for(const [id,max,min] of [['limit-steps',20,1],['limit-wall',120,1],['limit-attempts',2,1],['limit-total',30,1],['limit-tokens',1024,1],['limit-wait',5000,0]]){const v=Number(q('#'+id).value);if(!Number.isInteger(v)||v<min||v>max)return error(id,`请输入 ${min}–${max} 的整数；服务端仍需复核。`);}return true;}
function validateRun(needConfirm){clearErrors();if(!q('#run-goal').value.trim())return error('run-goal','请输入有边界的诊断目标。');if(!q('#run-verification').value.trim())return error('run-verification','请输入可以独立验证的完成文字。');if(!qa('input[name="run-action"]:checked').length){showToast('请选择至少一种允许动作。');return false;}if(needConfirm&&!q('#run-confirm').checked){showToast('请确认本次诊断范围。');q('#run-confirm').focus();return false;}return true;}
q('#demo-state').addEventListener('change',e=>{state=e.target.value;render();});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){goto(nav.dataset.page,nav.dataset.page==='W07'?'unknown':'ready');return;}const target=e.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action;const routes={goConnections:['W01'],editConnection:['W02'],newConnection:['W02','empty'],goProfiles:['W03'],goTest:['W04'],goStart:['W05'],goRun:['W06'],goUnknown:['W07','unknown'],goCancelling:['W07','cancelling']};if(routes[action]){goto(...routes[action]);return;}switch(action){case'reset':testCancelled=false;profileDraft=false;modelRefreshed=false;rotateVisible=false;evidenceRead=false;lastCommand='尚未操作';state=page==='W07'?'unknown':'ready';render();showToast('线框已重置；没有保存任何输入。');break;case'refresh':mark(page==='W08'?'ai.usage.summary':'ai.connections.list','已读取当前示例数据；不会发起计费请求。');break;case'disableConnection':state='disabled';render();mark('ai.connections.disable expectedRevision=3','连接已停用，新运行不可绑定；已绑定运行保留原版本。');break;case'showRotate':rotateVisible=!rotateVisible;render();if(rotateVisible)q('#rotate-credential').focus();break;case'rotateCredential':if(!q('#rotate-credential').value.trim()){error('rotate-credential','请输入新密钥。');break;}q('#rotate-credential').value='';rotateVisible=false;render();mark('ai.credentials.rotate credential=[REDACTED]','旧凭据身份已撤销；活跃运行将得到 CREDENTIAL_REVOKED，不会静默换账号。');break;case'saveConnection':if(!validateConnection())break;if(state==='conflict'){mark('ai.connections.update → CONFIG_CONFLICT','未保存，草稿仍保留；请读取最新版本后合并。');break;}const create=state==='empty';if(q('#create-credential'))q('#create-credential').value='';state='finished';render();mark(create?'ai.connections.create credential=[REDACTED]':'ai.connections.update expectedRevision=3','连接保存成功，返回 r4；不存在密钥明文回读。');break;case'refreshModels':modelRefreshed=true;render();mark('ai.models.refresh → operationId; ai.operations.get','已获取模型标识；图像与 GUI 能力不因此升级。');break;case'reloadConflict':state='ready';render();mark('ai.connections.get → r4','读取了服务器版本；真实实现应保留并展示草稿差异，用户合并后再提交。');break;case'discardDraft':state='ready';render();mark('ai.connections.get','已放弃本地草稿并读取示例配置。');break;case'newProfile':profileDraft=true;goto('W03','empty');break;case'fillProfile':goto('W03','ready');mark('本地草稿，尚未调用 ai.profiles.create','载入模板；保存前不产生配置。');break;case'saveProfile':if(!validateProfile())break;if(state==='conflict'){mark('ai.profiles.update → CONFIG_CONFLICT','配置没有保存；重新读取后合并。');break;}mark(profileDraft?'ai.profiles.create':'ai.profiles.update expectedRevision=7',profileDraft?'新 GUI 配置已创建；未更改默认指针。':'GUI 配置保存为 r8；已运行任务仍绑定 r7。');profileDraft=false;break;case'editModelProfile':q('#model-profile-editor').open=true;q('#model-profile-editor').scrollIntoView({block:'center'});break;case'saveModelProfile':case'createModelProfile':if(!q('#model-profile-name').value.trim()){error('model-profile-name','请输入名称。');break;}if(!q('#model-profile-model').value.trim()){error('model-profile-model','请输入模型 ID。');break;}mark(action==='saveModelProfile'?'ai.modelProfiles.update expectedRevision=4':'ai.modelProfiles.create','模型配置已保存；请明确选择其 revision 后再保存 GUI 配置，旧运行不变。');break;case'setDefault':if(state==='conflict'){mark('ai.profiles.setDefault → CONFIG_CONFLICT','默认指针已被更新，请读取 ai.profiles.default.get。');break;}mark('ai.profiles.setDefault expectedDefaultRevision=2','默认指针更新为 d3；只影响后续新运行。');break;case'disableProfile':state='disabled';render();mark('ai.profiles.disable expectedRevision=7','配置已停用，新绑定被禁止；现有运行继续使用原快照。');break;case'startTest':testCancelled=false;state='loading';render();mark('ai.tests.start → operationId=op-test-001','测试已启动；4 层证据仅使用合成资料，真实动作数为 0。');break;case'pollTest':if(state==='loading'){state='finished';render();}mark('ai.operations.get','读取模拟 operation 状态；未创建第二次测试。');break;case'cancelTest':state='cancelling';render();mark('ai.operations.cancel','取消已受理；尚未终态。');break;case'settleTest':testCancelled=true;state='finished';render();mark('ai.operations.get → cancelled（模拟）','测试取消已进入终态；未完成层保持未完成。');break;case'validateRun':if(validateRun(false))mark('本地预检 + runtime.capabilities / ai.profiles.get（只读）','配置预检通过；未调用模型、未启动 run、未执行输入。');break;case'startRun':if(!validateRun(true))break;lastCommand='gui.runs.start verification=element_text_equals/static_text + exact expected text; idempotencyKey=demo-start-001 → runId';goto('W06');showToast('模拟：运行已创建；配置版本固定。重复点击复用同一 idempotency key，不创建第二个 run。');break;case'pollRun':mark('gui.runs.get + gui.runs.events afterSequence=12','读取运行快照与增量事件，sequence 按顺序去重。');break;case'cancelRun':stopAcknowledged=true;state='cancelling';if(page!=='W07')page='W06';render();mark('gui.runs.cancel → accepted:true / state:cancelling','停止已接受，未声称已取消；等待输入核对与终态。');break;case'readEvidence':evidenceRead=true;render();mark('gui.runs.get + gui.runs.events afterSequence=12','读取最新已有证据；旧 snapshot 仍明确标记为动作前，不触发 observe 或重放。');break;case'settleCancel':state='finished';render();mark('gui.runs.get → cancelled / Runtime 已确认冲突域释放（模拟）','Runtime 安全复核完成，冲突域已释放；只能创建新运行，没有 resume。');break;case'usageFilter':mark('ai.usage.summary range=2026-10-08 / Asia-Shanghai','示例统计已刷新；未知用量仍为 null。');break;}});
window.__wireframe={getState:()=>({page,state,lastCommand,simulated:true}),goto,render};
render();
