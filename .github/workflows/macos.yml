name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Core is local
        run: |
          ./scripts/check-local-engine.sh
          swift package resolve
          ./scripts/check-local-engine.sh
          test ! -d .build/checkouts/2ndscreen
          test ! -e Package.resolved || ! grep -q 2ndscreen Package.resolved
      - name: Build
        run: swift build -c release
      - name: Product unit tests
        run: swift test
      - name: Native core unit tests
        run: swift test --package-path engine
      - name: Bundle the app
        run: ./scripts/bundle-app.sh
      - name: Bundle contents
        run: |
          find "build/Agent Desktop.app" | sort
          cat "build/Agent Desktop.app/Contents/Resources/build.json"
          codesign --verify --strict "build/Agent Desktop.app"
      - name: The archive matches its manifest
        run: ./scripts/verify-archive.sh build/Agent\ Desktop-*.zip build/Agent\ Desktop-*.manifest.json
      - name: The product CLI is the native agentdesktop and needs no Runtime for help and version
        run: |
          CLI="build/Agent Desktop.app/Contents/Resources/bin/agentdesktop"
          codesign --verify --strict "$CLI"
          "$CLI" help | grep -q 'usage: agentdesktop'
          "$CLI" version --format json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["data"]["build"]["source"] != "unknown", d'
          set +e; "$CLI" runtime status --endpoint /nonexistent/runtime.sock --format json > status.json; code=$?; set -e
          cat status.json
          test "$code" = 3
          python3 -c 'import json; d=json.load(open("status.json")); assert d["error"]["code"] == "runtime_offline", d'
      - name: The packaged CLI exposes only the current command surface
        run: python3 scripts/verify-command-surface.py "build/Agent Desktop.app/Contents/Resources/bin/agentdesktop"
      - name: Keep the archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Desktop-archive
          path: |
            build/Agent Desktop-*.zip
            build/Agent Desktop-*.manifest.json
          if-no-files-found: error
