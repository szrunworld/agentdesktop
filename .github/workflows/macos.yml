name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Dependencies resolve exactly as pinned
        run: |
          swift package resolve
          git diff --exit-code Package.resolved
          test ! -d Packages
      - name: Build checks have their regression cases
        run: ./scripts/test-check-engine-checkout.sh
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Bundle the app
        run: ./scripts/bundle-app.sh
      - name: Bundle contents
        run: |
          find "build/Agent Desktop.app" | sort
          cat "build/Agent Desktop.app/Contents/Resources/build.json"
          codesign --verify --strict "build/Agent Desktop.app"
      - name: The archive matches its manifest
        run: ./scripts/verify-archive.sh build/Agent\ Desktop-*.zip build/Agent\ Desktop-*.manifest.json
      - name: The bundled command line refuses tasks without the product's runtime
        run: |
          out="$("build/Agent Desktop.app/Contents/Resources/bin/agentdesktop" task status nope || true)"
          echo "$out"
          echo "$out" | grep -q '"capability_missing"'
          echo "$out" | grep -q 'Agent Desktop.app/Contents/Resources/bin/../task-runtime'
      - name: Keep the archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Desktop-archive
          path: |
            build/Agent Desktop-*.zip
            build/Agent Desktop-*.manifest.json
          if-no-files-found: error
