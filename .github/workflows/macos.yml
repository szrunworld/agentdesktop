name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR or branch: a new commit cancels the run of the commit it replaced.
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      LC_ALL: C
      LANG: C
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Core is local
        run: |
          ./scripts/check-local-engine.sh
          swift package resolve
          ./scripts/check-local-engine.sh
          test ! -d .build/checkouts/2ndscreen
          test ! -e Package.resolved || ! grep -q 2ndscreen Package.resolved
      - name: Build
        run: swift build -c release
      - name: Product unit tests
        timeout-minutes: 8
        run: swift test
      - name: Acceptance process identity safety
        run: |
          sh scripts/lib/process-identity-selftest.sh
          python3 scripts/lib/process-identity-kernel-test.py
      - name: Test watchdog self-tests
        # Each case runs the real watchdog against real processes (stalls of
        # 3 s, sampling, stops): 21 cases took 2 min 52 s on CI (#196), so 3
        # minutes left no margin. Room for the cases #193 adds; a hang still
        # ends the step.
        # In two steps, each with its own limit: after #215 the 52 cases took
        # 4 min 23 s in one step on CI (main 7fc5464), close to its 6 minutes.
        timeout-minutes: 6
        run: python3 -m unittest -v scripts.ci.test_test_watchdog.WatchdogTests
      - name: Test watchdog self-tests (discovery and whose processes may be signalled)
        timeout-minutes: 6
        run: python3 -m unittest -v scripts.ci.test_test_watchdog.WatchdogOwnershipTests
      - name: Native core unit tests
        timeout-minutes: 8
        env:
          # A bounded wait that runs out writes its evidence (what it waited
          # for, the stage, a sample of the process) here, inside the
          # directory uploaded below, so it reaches the artifact (#264).
          ENGINE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/engine-test-watchdog/bounded-waits
        run: |
          # On a pseudo-terminal so each result line shows when written, and
          # with a watchdog: after 150 s without output it lists the tests
          # still running, samples every process of the run and fails, instead
          # of the step sitting until its timeout with no evidence (#183).
          python3 scripts/ci/test-watchdog.py --stall 150 --out "$RUNNER_TEMP/engine-test-watchdog" -- \
            swift test --package-path engine
          # Reproduce executor starvation even on runners with many cores.
          # Apply strict mode to the test runner only; SwiftPM's own manifest
          # evaluation can stall under it on the CI toolchain.
          swift_bin="$(xcrun --find swift)"
          test_runner="$(dirname "$swift_bin")/../libexec/swift/pm/swiftpm-testing-helper"
          framework_dir="$(xcrun --show-sdk-platform-path)/Developer/Library/Frameworks"
          DYLD_FRAMEWORK_PATH="$framework_dir${DYLD_FRAMEWORK_PATH:+:$DYLD_FRAMEWORK_PATH}" \
          LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 "$test_runner" \
            --test-bundle-path engine/.build/debug/AgentDesktopEnginePackageTests.xctest/Contents/MacOS/AgentDesktopEnginePackageTests \
            --testing-library swift-testing --filter ControlServerTests
      - name: Keep the engine test watchdog's evidence
        # Always: a passing run can still have written a report (the check
        # for leftovers failed and the status was kept, #193).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-watchdog
          path: ${{ runner.temp }}/engine-test-watchdog
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDK unit tests (Python, TypeScript)
        run: |
          (cd sdks/python && python3 -m unittest discover -s tests -v)
          (cd sdks/typescript && node --test test/*.test.ts)
      - name: CoreDevice probe regression tests
        run: python3 -m unittest discover -s experiments/ios-coredevice -p 'test_*.py' -v
      - name: Bundle the app
        run: ./scripts/bundle-app.sh
      - name: Bundle contents
        run: |
          find "build/Agent Desktop.app" | sort
          cat "build/Agent Desktop.app/Contents/Resources/build.json"
          codesign --verify --strict "build/Agent Desktop.app"
      - name: The archive matches its manifest
        run: ./scripts/verify-archive.sh build/Agent\ Desktop-*.zip build/Agent\ Desktop-*.manifest.json
      - name: The product CLI is the native agentdesktop and needs no Runtime for help and version
        run: |
          CLI="build/Agent Desktop.app/Contents/Resources/bin/agentdesktop"
          codesign --verify --strict "$CLI"
          "$CLI" help | grep -q 'usage: agentdesktop'
          "$CLI" version --format json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["data"]["build"]["source"] != "unknown", d'
          set +e; "$CLI" runtime status --endpoint /nonexistent/runtime.sock --format json > status.json; code=$?; set -e
          cat status.json
          test "$code" = 3
          python3 -c 'import json; d=json.load(open("status.json")); assert d["error"]["code"] == "runtime_offline", d'
      - name: The packaged CLI exposes only the current command surface
        run: python3 scripts/verify-command-surface.py "build/Agent Desktop.app/Contents/Resources/bin/agentdesktop"
      - name: Release smoke (the archive unpacked as a new user meets it)
        run: |
          ./scripts/release-smoke.sh build/Agent\ Desktop-*.zip build/Agent\ Desktop-*.manifest.json --report release-smoke.json
          ./scripts/release-smoke.sh build/Agent\ Desktop-*.zip build/Agent\ Desktop-*.manifest.json --gui-execution --report release-smoke-gui.json
      - name: Keep the archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Desktop-archive
          path: |
            build/Agent Desktop-*.zip
            build/Agent Desktop-*.manifest.json
          if-no-files-found: error
