name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: No external packages; the engine is in the repository
        run: |
          swift package resolve
          test ! -e Package.resolved
          test ! -d Packages
          test ! -d .build/checkouts || test -z "$(ls -A .build/checkouts)"
      - name: The migrated engine matches its source map
        run: ./scripts/verify-engine-source-map.sh
      - name: The source map check has its regression cases
        run: ./scripts/test-verify-engine-source-map.sh
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Bundle the app
        run: ./scripts/bundle-app.sh
      - name: Bundle contents
        run: |
          find "build/Agent Desktop.app" | sort
          cat "build/Agent Desktop.app/Contents/Resources/build.json"
          codesign --verify --strict "build/Agent Desktop.app"
      - name: The archive matches its manifest
        run: ./scripts/verify-archive.sh build/Agent\ Desktop-*.zip build/Agent\ Desktop-*.manifest.json
      - name: The bundle carries no old engine command line and does carry the notices
        run: |
          test ! -e "build/Agent Desktop.app/Contents/Resources/bin/2ndscreen"
          test ! -e "build/Agent Desktop.app/Contents/Resources/libexec"
          test -s "build/Agent Desktop.app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          python3 -c 'import json; e=json.load(open("build/Agent Desktop.app/Contents/Resources/build.json"))["engine"]; assert e["location"].startswith("in-repo") and e["version"] == "v0.2.0", e'
      - name: The product CLI is the native agentdesktop and needs no Runtime for help and version
        run: |
          CLI="build/Agent Desktop.app/Contents/Resources/bin/agentdesktop"
          codesign --verify --strict "$CLI"
          "$CLI" help | grep -q 'usage: agentdesktop'
          "$CLI" version --format json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["data"]["build"]["source"] != "unknown", d'
          set +e; "$CLI" runtime status --endpoint /nonexistent/runtime.sock --format json > status.json; code=$?; set -e
          cat status.json
          test "$code" = 3
          python3 -c 'import json; d=json.load(open("status.json")); assert d["error"]["code"] == "runtime_offline", d'
      - name: Keep the archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Desktop-archive
          path: |
            build/Agent Desktop-*.zip
            build/Agent Desktop-*.manifest.json
          if-no-files-found: error
